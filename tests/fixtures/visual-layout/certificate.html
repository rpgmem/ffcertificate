<div class="ffc-visual-page" style="position:relative;width:1123px;height:794px;overflow:hidden">
<div class="ffc-visual-el ffc-visual-frame" style="position:absolute;left:20px;top:20px;width:1075px;height:746px;z-index:1;border:4px double #1d3557;border-radius:8px"></div>
<div class="ffc-visual-el ffc-visual-text" style="position:absolute;left:100px;top:80px;width:923px;height:110px;z-index:2;font-family:Cinzel, Georgia, serif;font-size:40px;font-weight:700;color:#1d3557;text-align:center;line-height:1.2;letter-spacing:2px;text-transform:uppercase">Certificado<br>
de participação</div>
<div class="ffc-visual-el ffc-visual-field ffc-fit" style="position:absolute;left:100px;top:300px;width:923px;height:50px;z-index:3;font-size:32px;font-weight:400;color:#000000;text-align:center;line-height:1.2">{{name}}</div>
<div class="ffc-visual-el ffc-visual-field ffc-fit-box" style="position:absolute;left:100px;top:380px;width:923px;height:80px;z-index:4;font-size:18px;font-weight:400;color:#000000;text-align:left;line-height:1.5;font-style:italic">{{model:place}}</div>
<div class="ffc-visual-el ffc-visual-field" style="position:absolute;left:700px;top:480px;width:300px;height:30px;z-index:5;transform:rotate(-2deg);font-size:16px;font-weight:400;color:#000000;text-align:right;line-height:1.2">{{schedule:date:format=d/m/Y}}</div>
<div class="ffc-visual-el ffc-visual-image" style="position:absolute;left:80px;top:520px;width:120px;height:120px;z-index:6;overflow:hidden"><img src="https://example.test/wp-content/uploads/seal.png" alt="" style="position:absolute;left:-60px;top:0px;width:240px;height:120px;max-width:none"></div>
<div class="ffc-visual-el ffc-visual-image" style="position:absolute;left:220px;top:520px;width:200px;height:120px;z-index:7;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="https://example.test/wp-content/uploads/seal.png" alt="" style="max-width:200px;max-height:120px"></div>
<div class="ffc-visual-el ffc-visual-image" style="position:absolute;left:700px;top:560px;width:200px;height:80px;z-index:8;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="{{signer:signature}}" alt="" style="max-width:200px;max-height:80px"></div>
<div class="ffc-visual-el ffc-visual-field" style="position:absolute;left:650px;top:645px;width:300px;height:24px;z-index:9;font-size:16px;font-weight:700;color:#000000;text-align:center;line-height:1.2">{{signer:name}}</div>
<div class="ffc-visual-el ffc-visual-qr" style="position:absolute;left:40px;top:660px;width:90px;height:100px;z-index:10;display:flex;align-items:center;justify-content:center">{{qr_code:size=90:margin=0}}</div>
<div class="ffc-visual-el ffc-visual-html" style="position:absolute;left:150px;top:700px;width:500px;height:50px;z-index:11;overflow:hidden"><p style="font-size:10px">Código: <strong>{{auth_code}}</strong></p></div>
</div>
