name: Asset Build Verification

on:
  pull_request:
    branches: [main, develop, "release/**"]
# Path filters were removed because branch protection requires this
# check on every PR. Skipped runs (path-filtered) never report status
# and leave PRs in mergeable_state: blocked. With npm cache + npm ci
# the job finishes in well under a minute.

# Every job only reads the repository; nothing here writes to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify minified assets are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Check for uncommitted changes
        run: |
          # `git status --porcelain` and not `git diff`: a new sheet or script
          # whose `.min` was never committed is an untracked file, which
          # `git diff` does not see (#2344).
          if [ -n "$(git status --porcelain --untracked-files=all -- assets/)" ]; then
            echo "::error::Minified assets are stale or missing. Run 'npm run build' and commit the results."
            git status --short --untracked-files=all -- assets/
            exit 1
          fi
          echo "All minified assets are up to date."
